<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a10">
  <meta name="robots" content="index,follow">
  <title>Impressum — Xsi Beats Studio</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#090a10;--surface:#11131b;--line:rgba(255,255,255,.1);--text:#f3f3f7;--muted:#a4a7b6;--accent:#49e4c3;--gold:#e7ce8a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 5%,rgba(167,139,250,.16),transparent 36%),var(--bg);color:var(--text);display:grid;place-items:center;padding:26px}
    main{width:min(900px,100%);display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:center;border:1px solid var(--line);border-radius:24px;background:rgba(17,19,27,.88);padding:clamp(22px,5vw,52px);box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .kicker{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin:0 0 12px}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.05em;margin:0 0 28px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 16px}
    .legal-copy{font-size:14px;line-height:1.8;color:var(--muted)}.legal-copy strong{color:var(--text)}.legal-copy address{font-style:normal;margin:0 0 18px}.legal-copy a{color:var(--accent);text-decoration:none}.legal-copy a:hover{text-decoration:underline}
    .logo{display:block;width:min(100%,300px);height:auto;border:1px solid var(--line);border-radius:17px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
    .foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:18px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:#7d8294}.foot a{color:var(--muted);text-decoration:none}.foot a:hover{color:var(--accent)}
    @media(max-width:680px){body{padding:14px}main{grid-template-columns:1fr;gap:22px;border-radius:18px}.logo{width:min(100%,240px);margin:auto}.foot{grid-column:1;flex-wrap:wrap}}
  </style>
</head>
<body>
  <main>
    <section>
      <p class="kicker">Xsi Beats Studio · XsiKOM Digital Projects Group</p>
      <h1>Impressum</h1>
      <div class="legal-copy">
        <h2>Angaben gemäß § 5 DDG</h2>
        <address>
          <strong>XsiKOM Projects GROUP</strong><br>
          Komi TEVI<br>
          Am Königsfloß 12<br>
          55252 Mainz-Kastel<br>
          Deutschland
        </address>
        <p><strong>Kontakt</strong><br>E-Mail: <a href="mailto:xsikom.digital.group@gmail.com">xsikom.digital.group@gmail.com</a></p>
      </div>
    </section>
    <img class="logo" src="./assets/xsikom-logo.svg" alt="XsiKOM Digital Projects Group — From the Roots to the Algorithm" width="440" height="589">
    <footer class="foot"><span>© <span id="year">2026</span> XsiKOM Projects GROUP</span><span><a href="./index.html">Zurück zum Studio</a> · <a href="./datenschutz.html">Datenschutz</a></span></footer>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
